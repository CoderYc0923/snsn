[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snsn-api"
version = "0.1.1"
description = "SnSn speech shadowing API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "python-multipart==0.0.20",
  "pydantic-settings==2.9.1",
  "oss2==2.19.1",
  "dashscope==1.23.1",
  "httpx==0.28.1",
]

[project.scripts]
snsn-api = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
